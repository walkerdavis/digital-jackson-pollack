repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        name: ruff lint
        args: [--fix]

  - repo: local
    hooks:
      - id: unit-tests
        name: unit tests
        entry: python -m unittest discover -s test -p "test_*.py" -v
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
